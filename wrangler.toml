# Configuração da Cloudflare. O script de publicação (ou o botão "Deploy to Cloudflare") troca o database_id pelo do seu banco.
name = "fornada-app"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "fornada-db"
database_id = "896bd496-b3f5-4079-bd09-16a70276b70c"
migrations_dir = "migrations"

# A cada 10 minutos: confere Pix pendentes e, uma vez por dia, limpa sessões e códigos vencidos.
[triggers]
crons = ["*/10 * * * *"]

[vars]
BRAND = "Fornada"
PRICE_30 = "1990"
PRICE_90 = "4990"
PRICE_365 = "15990"
TRIAL_DAYS = "7"
FREE_PRODUCTS = "5"
FREE_ORDERS = "20"
REFUND_DAYS = "7"
PIX_FEE_PCT = "0.99"
CONTACT_EMAIL = "italonft2005@gmail.com"
OWNER_NAME = "Fornada"
